services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      PIPELINE_MODE: ${PIPELINE_MODE:-auto}
      SIMULATOR_TEMPLATE_DIR: /app/apps/simulator-template
    volumes:
      - ./samples:/tmp/appbeam-uploads

  # One-shot orchestration CLI: docker compose run pipeline simulate /workspace/app.apk
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    env_file:
      - path: .env
        required: false
    environment:
      PIPELINE_MODE: ${PIPELINE_MODE:-auto}
      SIMULATOR_TEMPLATE_DIR: /app/apps/simulator-template
    entrypoint: ["node", "packages/pipeline/dist/cli.js"]
    command: ["--help"]
    volumes:
      - ./samples:/workspace
